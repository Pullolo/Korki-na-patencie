services:
  db:
    image: postgres:17-alpine
    container_name: korki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: korki
      POSTGRES_PASSWORD: korki
      POSTGRES_DB: korki
    ports:
      - "5432:5432"
    volumes:
      - korki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korki -d korki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  korki-pgdata:
